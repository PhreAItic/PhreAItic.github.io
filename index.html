<style>
:root{--ink:#14202b;--paper:#f4f6f8;--card:#ffffff;--line:#d9e0e6;--muted:#5d6b78;--accent:#0072B2;--accent2:#D55E00;--ok:#009E73;--warn:#E69F00;
--shadow:0 1px 2px rgba(20,32,43,.08),0 8px 24px rgba(20,32,43,.06);--hero1:#dce8f0;--hero2:#f4f6f8;--grid:#e6ebef}
:root[data-theme="dark"]{--ink:#e8eef3;--paper:#0e151b;--card:#16202a;--line:#27333f;--muted:#8fa0af;--accent:#56b4e9;--accent2:#f08a3c;--ok:#33c9a0;--warn:#f5c04a;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--hero1:#17303f;--hero2:#0e151b;--grid:#202c37}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--ink:#e8eef3;--paper:#0e151b;--card:#16202a;--line:#27333f;--muted:#8fa0af;--accent:#56b4e9;--accent2:#f08a3c;--ok:#33c9a0;--warn:#f5c04a;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--hero1:#17303f;--hero2:#0e151b;--grid:#202c37}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:30;display:flex;gap:12px;align-items:center;padding:10px 16px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top img.logo{height:26px;display:block}
header.top img.logo-d{display:none}
:root[data-theme="dark"] header.top img.logo-l{display:none}:root[data-theme="dark"] header.top img.logo-d{display:block}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] header.top img.logo-l{display:none}:root[data-theme="auto"] header.top img.logo-d{display:block}}
.search{position:relative;flex:1;min-width:140px;max-width:520px}
.search input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
.results button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:9px 14px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.results button:hover,.results button.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.results small{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:2px}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.nav{display:flex;gap:10px;align-items:center;margin-left:auto;font-size:13px}
.nav a{color:var(--muted);text-decoration:none;white-space:nowrap}.nav a:hover{color:var(--ink)}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:0 16px 120px}
/* hero */
.chip{background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;backdrop-filter:blur(6px)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:14px;letter-spacing:.01em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.card .read{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:6px 0 2px;min-height:34px}
.card .read b{font-size:24px;letter-spacing:-.01em}
.card .read span{color:var(--muted);font-size:13px}
.card .why{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.card.wide{grid-column:1/-1}
.card.empty{opacity:.6}
svg.ch{width:100%;height:auto;display:block;overflow:visible;touch-action:none}
svg.ch text{fill:var(--muted);font-size:10.5px}
svg.ch .gl{stroke:var(--grid);stroke-width:1}
svg.ch .cur{stroke:var(--ink);stroke-width:1;opacity:.55}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.sec{margin:26px 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* map view */
.mapbox{position:relative;border-radius:14px;overflow:hidden;background:var(--hero1);border:1px solid var(--line)}
.mapbox canvas{display:block;width:100%;height:auto}
.mapbox .tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;box-shadow:var(--shadow);display:none;white-space:nowrap}
.mapbox .lg{position:absolute;left:12px;bottom:10px;font-size:11.5px;background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:8px;padding:5px 9px;border:1px solid var(--line)}
.mapbox .lg div.bar{height:8px;width:170px;border-radius:4px;margin:3px 0}
.mapbox .lg div.tk{display:flex;justify-content:space-between;color:var(--muted)}
.ovs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ovs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:13.5px;cursor:pointer}
.ovs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ovs button[disabled]{opacity:.4;cursor:default}
.mapbig{margin-top:10px}
.mapbig .mapbox canvas{min-height:380px}
/* time bar */
.timebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.timebar .in{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center}
.timebar button{border:1px solid var(--line);background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:14px;cursor:pointer;display:grid;place-items:center;flex:none}
.timebar button.play{background:var(--accent);color:#fff;border-color:var(--accent)}
.timebar .when{min-width:118px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.timebar .when small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.timebar .track{flex:1;position:relative;padding-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--accent);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:-2px;padding:0 4px}
.timebar label{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;gap:5px;align-items:center}
footer{max-width:1180px;margin:30px auto 0;padding:0 16px 140px;color:var(--muted);font-size:12.5px}
#country{display:none}
body.m-country #city{display:none}body.m-country #country{display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.kv b{display:block;font-size:20px}.kv span{color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
@media (max-width:720px){.nav a.opt{display:none}.timebar .when{min-width:84px}.timebar label{display:none}header.top{flex-wrap:wrap}.search{order:5;flex-basis:100%;max-width:none}}
.mast{position:relative;margin:0 -16px;background:linear-gradient(115deg,#0c4a5e 0%,#14788a 48%,#1e8a8a 100%);color:#fff;padding:22px 16px 46px;overflow:hidden}
.mast::before{content:"";position:absolute;inset:0;background:radial-gradient(1200px 160px at 20% 120%,rgba(255,255,255,.14),transparent 70%),radial-gradient(900px 140px at 80% -20%,rgba(255,255,255,.10),transparent 70%)}
.mast-in{position:relative;max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap}
.mast-l{display:flex;gap:12px;align-items:flex-start}
.mlogo{width:54px;height:54px;border-radius:12px;background:#fff;padding:5px;object-fit:contain;display:block}
.kicker{font-weight:700;letter-spacing:.02em}.mini{font-size:12.5px;opacity:.85;max-width:300px}
.mast-r{text-align:right;margin-left:auto}
.mast h1{margin:0;font-size:clamp(34px,6vw,66px);line-height:1;letter-spacing:-.025em}
.mast .sub{font-size:14.5px;opacity:.92;margin-top:6px}
.mast .watch{font-weight:700;margin-top:10px;font-size:15.5px}
.mast .wave{position:absolute;left:0;bottom:-1px;width:100%;height:34px;display:block}
.hero{position:relative;margin:-6px -16px 0;background:var(--paper);height:min(58vh,520px);min-height:340px;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
.hero .skel{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none;transition:opacity .6s}
.herometa{display:grid;grid-template-columns:1.1fr 1.2fr 1fr;gap:24px;padding:6px 4px 10px;border-bottom:1px solid var(--line)}
.hm .h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px}
.hm.mid{text-align:center}.hm.mid .h4{font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}
.elegend i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,#3f8fa6,#8fc0b8,#e9e3b4,#d9a860,#9a6428)}
.elegend div{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.lgl{display:flex;flex-direction:column;gap:5px;margin:10px 0 6px;font-size:12.5px}
.lgl span{display:flex;align-items:center;gap:8px}.lgl s{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}.lgl s.sq{border-radius:3px}.lgl s.ln{height:3px;border-radius:2px;width:16px}
.fine{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.45}
.num{margin-bottom:10px}.num b{display:block;font-size:26px;letter-spacing:-.01em;color:var(--accent)}.num span{font-size:12.5px;color:var(--muted)}
.chap{display:flex;align-items:center;gap:16px;margin:38px 0 14px}
.chap .n{font-size:50px;font-weight:800;color:color-mix(in srgb,var(--accent) 22%,transparent);line-height:1;font-family:ui-monospace,Menlo,monospace}
.chap h2{margin:0;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.01em}
.chap svg{display:block;margin-top:4px}
.ind{display:flex;flex-direction:column;gap:2px}
.ind .it{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.ind .dot{width:18px;height:18px;border-radius:50%;margin-top:3px;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 18%,transparent)}
.ind .it h4{margin:0;font-size:12.5px;font-weight:500;color:var(--muted)}
.ind .it b{display:block;font-size:17px}
.ind .it small{color:var(--accent);font-size:12.5px}
.two{display:grid;grid-template-columns:minmax(260px,.8fr) 1.4fr;gap:20px;align-items:start}
.threecol{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.timeline{position:relative;height:190px;margin:14px 0 4px}
.timeline .ax{position:absolute;left:3%;right:3%;top:50%;height:3px;background:var(--line);border-radius:2px}
.timeline .ax i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.ev{position:absolute;width:150px;transform:translateX(-50%);font-size:12px;line-height:1.35;opacity:.28;transition:opacity .4s}
.ev.on{opacity:1}.ev b{display:block;font-size:12.5px}
.ev::after{content:"";position:absolute;left:50%;width:1px;background:var(--line)}
.ev.up{bottom:calc(50% + 14px)}.ev.up::after{top:100%;height:12px}.ev.dn{top:calc(50% + 14px)}.ev.dn::after{bottom:100%;height:12px}
.ev .pt{position:absolute;left:50%;width:13px;height:13px;border-radius:50%;transform:translateX(-50%);border:3px solid var(--card)}
.ev.up .pt{top:calc(100% + 6px)}.ev.dn .pt{bottom:calc(100% + 6px)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.act{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.act .no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.act h4{margin:0 0 6px;font-size:15px}.act ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink)}.act li{margin:3px 0}
.donuts{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.donut{display:flex;gap:12px;align-items:center;max-width:300px}
.donut svg{flex:none}.donut p{margin:0;font-size:12.5px;color:var(--muted)}
.cta{margin-top:30px;background:linear-gradient(115deg,#0c4a5e,#14788a);color:#fff;border-radius:18px;padding:22px 26px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.cta h3{margin:0 0 6px;font-size:20px}.cta p{margin:3px 0;font-size:13.5px;opacity:.92;max-width:640px}.cta a{color:#fff}
.btn{display:inline-block;background:#fff;color:#0c4a5e!important;border-radius:999px;padding:9px 18px;font-weight:700;text-decoration:none;font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){.herometa{grid-template-columns:1fr}.hm.mid{text-align:left}.two{grid-template-columns:1fr}.mast-r{text-align:left;margin-left:0}.ev{width:110px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  if (lvl) { const labs = ["<10%", "10–30%", "30–60%", ">60%"], vals = [0, 1, 2, 3].map(k => (lvl[k] ? lvl[k].fire * 100 : 0)), w = 300, h = 150; const sv = labs.map((l, i) => { const bh = vals[i] / 100 * 100; return `<rect x="${30 + i * 66}" y="${120 - bh}" width="44" height="${bh}" rx="4" fill="${["#e0a030", "#d2691e", "#b3261e", "#6b0f1a"][i]}" class="fb" data-h="${bh}" data-y="${120 - bh}"/><text x="${52 + i * 66}" y="${114 - bh}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">${Math.round(vals[i])}%</text><text x="${52 + i * 66}" y="140" text-anchor="middle">${l}</text>`; }).join(""); $("#fbars").innerHTML = `<svg class="ch" viewBox="0 0 ${w} ${h}">${sv}</svg>`;
    viewOnce($("#fbars"), () => $$(".fb", $("#fbars")).forEach((r, i) => { r.animate([{y: "120px", height: "0px"}, {y: r.dataset.y + "px", height: r.dataset.h + "px"}], {duration: 900, delay: i * 120, easing: "ease-out", fill: "backwards"}); })); }
  $$(".dn", B).forEach(d => viewOnce(d, () => { d.animate([{strokeDasharray: `0 ${d.dataset.c}`}, {strokeDasharray: `${d.dataset.to} ${d.dataset.c}`}], {duration: 1200, easing: "ease-out", fill: "forwards"}); }));
  listeners.length = 0; listeners.push(...ups); if (cityMapView) listeners.push(m => cityMapView.draw(m)); setTime(0);
  Hero.onRisen = () => { if (tok === cityToken && !REDUCED) setTimeout(() => startPlay(0), 250); };
}
function countUp(node, v, f) { if (v == null) { node.textContent = "—"; return; } if (REDUCED) { node.textContent = f(v); return; } const t0 = performance.now(); const s = now => { const k = EASE((now - t0 - 500) / 1600); node.textContent = f(v * k); if (k < 1) requestAnimationFrame(s); }; requestAnimationFrame(s); }
function fillTicks() { const tk = $("#ticks"); tk.innerHTML = ""; for (let m = 0; m <= 12; m += 3) tk.appendChild(el("span", {}, dateAt(m).toLocaleDateString(L, {month: "short"}))); }
async function buildCityMap(c, tok) {
  const layers = cityLayers; if (tok !== cityToken) return;
  const h = $("#mapCity"); cityMapView = new MapView(h, {maxH: 460, clip: false, onClick: (lon, lat) => nearestTownOpen(lon, lat)});
  const avail = {soil: !!layers.soil, fire: !!layers.fire, spi: !!layers.spi && layers.spi.cells.length, tws: !!layers.tws && layers.tws.cells.length, reg: !!layers.reg};
  const ovs = $("#ovCity"); ovs.innerHTML = ""; const ov = avail[S.ov] ? S.ov : Object.keys(avail).find(k => avail[k]) || "soil";
  for (const k of ["soil", "fire", "spi", "tws", "reg"]) { const b = el("button", {}, t("overlays")[k]); if (!avail[k]) b.disabled = true; if (k === ov) b.classList.add("on"); b.onclick = () => { S.ov = k; setCityOv(k, c); [...ovs.children].forEach(x => x.classList.toggle("on", x === b)); }; ovs.appendChild(b); }
  setCityOv(ov, c); viewOnce(h, () => { if (!S.playing && tok === cityToken) startPlay(0); }, 0.4);
}
function setCityOv(ov, c) {
  const d = cityLayers[ov], R = 3.2, k = Math.cos(c.lat * Math.PI / 180); cityMapView.setView([c.lon - R / k * 1.25, c.lat - R, c.lon + R / k * 1.25, c.lat + R]);
  const data = ov === "reg" && d ? {areas: d.areas.filter(a => Math.abs(a.lon - c.lon) < 8 && Math.abs(a.lat - c.lat) < 8), kind: "reg"} : d; cityMapView.set(data, ov, null, c); cityMapView.draw(S.m);
}
async function nearestTownOpen(lon, lat) {
  const ix = S.index; if (!ix) return; let best = null, bd = (80 / 111.32) ** 2;
  for (const tw of ix.t) { if (tw[4] < 50000) break; const d = dist2(lat, lon, tw[3], tw[2]); if (d < bd) { bd = d; best = tw; } }
  if (best) { window.scrollTo({top: 0, behavior: "smooth"}); openCity({name: best[0], iso: best[1], lon: best[2], lat: best[3], pop: best[4]}); }
}

/* ============================================================ country mode */
let cMap = null, cTok = 0;
async function openCountry(iso, push = true) {
  const tok = ++cTok; S.country = iso; setMode("country", false); stopPlay();
  const co = S.world.find(x => x.code === iso); if (!co) return;
  $("#cName").textContent = countryName(iso) + " · " + co.continent;
  if (push) { try { history.replaceState(null, "", "#country=" + iso + "&ov=" + S.ov); } catch (e) {} }
  document.title = countryName(iso) + " · PhreAItic";
  if (!cMap) cMap = new MapView($("#mapCountry"), {maxH: 640, onClick: (lon, lat) => nearestTownOpen(lon, lat)});
  const bb = co.bbox, k = Math.cos((bb[1] + bb[3]) * Math.PI / 360); // keep France-sized countries large, include overseas by trimming to the main body when huge
  const view = viewFor(co);
  cMap.setView(view);
  const ovs = $("#ovCountry"); ovs.innerHTML = "";
  const avail = {soil: co.ns > 0, fire: co.nf > 0, spi: true, tws: true, reg: ["USA", "CAN", "MEX", "TWN", "BRA"].includes(iso)};
  if (!avail[S.ov]) S.ov = "soil";
  for (const key of ["soil", "fire", "spi", "tws", "reg"]) { const b = el("button", {}, t("overlays")[key]); b.disabled = !avail[key]; if (key === S.ov) b.classList.add("on"); b.onclick = () => { S.ov = key; [...ovs.children].forEach(x => x.classList.toggle("on", x === b)); loadOv(tok); }; ovs.appendChild(b); }
  $("#cHint").textContent = t("cHint");
  $("#cKv").innerHTML = [[co.ns, t("overlays").soil], [co.nf, t("overlays").fire], [co.nr, t("river")], [co.ng, t("gw")]].filter(x => x[0]).map(x => `<div><b>${x[0].toLocaleString(L)}</b><span>${x[1]} · ${t("cells")}/${t("stations")}</span></div>`).join("");
  await loadOv(tok); if (tok !== cTok) return;
  listeners.length = 0; listeners.push(m => cMap.draw(m)); setTime(0);
  if (!REDUCED) setTimeout(() => { if (tok === cTok && S.mode === "country") startPlay(0); }, 400);
}
function viewFor(co) {  // main body: bbox of the largest ring, widened by the rings within 1/6 of its size
  let big = null, ba = 0; for (const r of co.rings) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of r) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); } const a = (x1 - x0) * (y1 - y0); if (a > ba) { ba = a; big = [x0, y0, x1, y1]; } }
  let b = big.slice(); const w = b[2] - b[0], h = b[3] - b[1];
  for (const r of co.rings) { let cx = 0, cy = 0; for (const p of r) { cx += p[0]; cy += p[1]; } cx /= r.length; cy /= r.length; if (cx > b[0] - w * .6 && cx < b[2] + w * .6 && cy > b[1] - h * .6 && cy < b[3] + h * .6) for (const p of r) { b[0] = Math.min(b[0], p[0]); b[1] = Math.min(b[1], p[1]); b[2] = Math.max(b[2], p[0]); b[3] = Math.max(b[3], p[1]); } }
  const px = (b[2] - b[0]) * .04 + .2, py = (b[3] - b[1]) * .04 + .2; return [b[0] - px, b[1] - py, b[2] + px, b[3] + py];
}
async function loadOv(tok) {
  const iso = S.country, co = S.world.find(x => x.code === iso); let d = null;
  cMap.set(null, S.ov, iso, null);
  if (S.ov === "soil") d = await soilCells(iso); else if (S.ov === "fire") d = await fireCells(iso); else if (S.ov === "reg") d = await regAreas(iso);
  else d = await tileCells(S.ov, co.bbox);
  if (tok !== cTok) return;
  try { history.replaceState(null, "", "#country=" + iso + "&ov=" + S.ov); } catch (e) {}
  cMap.set(d, S.ov, iso, null);
}

/* ============================================================ mode, search, boot */
function setMode(m, go = true) {
  S.mode = m; document.body.className = "m-" + m; $$("#modeseg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  $("#loopL").style.display = m === "country" ? "" : "none";
  if (go) { if (m === "country") openCountry(S.country || (S.city && S.city.iso) || "FRA"); else openCity(S.city || DEFAULT_CITY); }
}
function $$(s, r = document) { return [...r.querySelectorAll(s)]; }
function countryName(iso) { const c = S.world && S.world.find(x => x.code === iso); return c ? (c[L] || c.en) : iso; }
let allTowns = {};
async function search(qs) {
  const q = norm(qs.trim()); const box = $("#res"); if (q.length < 2 || !S.index) { box.style.display = "none"; return; }
  const out = [];
  for (const c of S.index.c) if (norm(c[1]).includes(q) || norm(c[2]).includes(q) || norm(c[3]).includes(q) || norm(c[4]).includes(q) || c[0].toLowerCase() === q) out.push({k: "c", c, s: norm(c[L === "en" ? 1 : L === "fr" ? 2 : L === "es" ? 3 : 4]).startsWith(q) ? 0 : 1});
  const tw = []; for (const x of S.index.t) { if (norm(x[0]).includes(q)) tw.push({k: "t", t: x, s: norm(x[0]).startsWith(q) ? 0 : 1}); if (tw.length > 200) break; }
  tw.sort((a, b) => a.s - b.s || b.t[4] - a.t[4]); out.sort((a, b) => a.s - b.s);
  const rows = [...out.slice(0, 3), ...tw.slice(0, 7)];
  if (rows.length < 5 && S.country && allTowns[S.country]) { for (const x of allTowns[S.country]) if (norm(x[0]).includes(q)) rows.push({k: "t", t: [x[0], S.country, x[1], x[2], x[3]]}); }
  box.innerHTML = ""; if (!rows.length) { box.style.display = "none"; return; }
  rows.slice(0, 10).forEach((r, i) => {
    const b = el("button", {}, r.k === "c" ? `<span>${r.c[L === "en" ? 1 : L === "fr" ? 2 : L === "es" ? 3 : 4]}</span><small>${t("country")}</small>` : `<span>${r.t[0]}</span><small>${countryName(r.t[1])} · ${r.t[4].toLocaleString(L)}</small>`);
    b.onclick = () => { box.style.display = "none"; $("#q").value = ""; r.k === "c" ? openCountry(r.c[0]) : openCity({name: r.t[0], iso: r.t[1], lon: r.t[2], lat: r.t[3], pop: r.t[4]}); };
    if (!i) b.classList.add("on"); box.appendChild(b);
  });
  box.style.display = "block";
}
async function ensureTowns(iso) { if (!iso || allTowns[iso]) return; const d = await J(`towns/${iso}.json`); allTowns[iso] = d ? d.map(x => [x[0], x[1], x[2], x[3]]) : []; }
function fillText() {
  document.documentElement.lang = L; $("#q").placeholder = t("search"); $("#modeseg [data-m=city]").textContent = t("city"); $("#modeseg [data-m=country]").textContent = t("country");
  $("#lnkClassic").textContent = t("classic"); $("#lnkTrust").textContent = t("trust"); $("#lang").textContent = L.toUpperCase(); $("#bBack").title = t("back"); $("#bFwd").title = t("fwd"); $("#bPlay").title = t("play");
  $("#loopT").textContent = t("loop"); $("#foot").innerHTML = t("footer") + " " + t("tz");
  const tk = $("#ticks"); tk.innerHTML = ""; for (let m = 0; m <= 12; m += 3) { const d = dateAt(m); tk.appendChild(el("span", {}, d.toLocaleDateString(L, {month: "short"}) + (m === 0 ? "" : ""))); }
}
async function boot() {
  fillText(); setTime(0);
  $("#bPlay").onclick = () => S.playing ? stopPlay() : startPlay(S.m >= 11.95 ? 0 : S.m);
  $("#bBack").onclick = () => setTime(0, true); $("#bFwd").onclick = () => setTime(Math.floor(S.m + 1.001), true);
  $("#slider").addEventListener("input", e => setTime(+e.target.value, true));
  $("#modeseg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setMode(b.dataset.m); });
  $("#theme").onclick = () => { const cur = document.documentElement.dataset.theme; const n = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem("nappes-theme", n); } catch (e) {} listeners.forEach(f => f(S.m)); if (S.mode === "city" && S.city) openCity(S.city, false); };
  $("#lang").onclick = () => { const order = ["en", "fr", "es", "de"]; L = order[(order.indexOf(L) + 1) % 4]; try { localStorage.setItem("nappes-lang", L); } catch (e) {} fillText(); S.mode === "city" ? openCity(S.city, false) : openCountry(S.country, false); };
  try { const th = localStorage.getItem("nappes-theme"); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; } catch (e) {}
  const q = $("#q"); let tmr; q.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { ensureTowns(S.country || (S.city && S.city.iso)).then(() => search(q.value)); search(q.value); }, 90); });
  q.addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("#res button"); if (b) b.click(); } if (e.key === "Escape") $("#res").style.display = "none"; });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#res").style.display = "none"; });
  const [world, index] = await Promise.all([J(WORLD_FILE), J("search_index.json")]);
  S.world = world || []; S.index = index || {c: [], t: []};
  J("world_soil.json").then(d => S.soilBt = d && d.backtest); J("world_fire.json").then(d => S.fireBt = d && d.backtest);
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("country")) { S.ov = h.get("ov") || "soil"; S.country = h.get("country"); await openCountry(h.get("country"), false); return; }
  let c = DEFAULT_CITY;
  if (h.get("city")) { const p = decodeURIComponent(h.get("city")).split("|"); if (p.length >= 5) c = {name: p[0], iso: p[1], lon: +p[2], lat: +p[3], pop: +p[4]}; }
  S.country = c.iso; ensureTowns(c.iso); await openCity(c, !h.get("city"));

boot();
